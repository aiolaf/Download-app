<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NinA AI — Email Editor</title>

  <!-- Vendored Handlebars (offline-friendly, works from file://). -->
  <script src="./dist/vendor.handlebars.min.js"></script>
  <!-- Template HTML + sample data, auto-generated by build.js. -->
  <script src="./dist/template.js"></script>

  <style>
    :root {
      --bg: #0c0e18;
      --card: #151828;
      --card-soft: #1a1e30;
      --border: #33374d;
      --text: #f2f2f2;
      --muted: #a6a6a6;
      --accent: #9952e0;
      --accent-light: #bf80ff;
      --gold: #fde68b;
      --danger: #e0526a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ---- top bar ---------------------------------------------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(12, 14, 24, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }
    .brand-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .brand small {
      color: var(--muted);
      font-weight: 400;
      margin-left: 6px;
    }
    .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    button, .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover, .btn:hover {
      border-color: var(--accent);
      color: var(--accent-light);
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover {
      background: var(--accent-light);
      border-color: var(--accent-light);
      color: #fff;
    }
    button.ghost { background: transparent; }
    button.danger { color: var(--danger); border-color: transparent; }
    button.danger:hover { border-color: var(--danger); }

    /* ---- main layout ----------------------------------------- */
    .layout {
      display: grid;
      grid-template-columns: minmax(360px, 460px) 1fr;
      height: calc(100vh - 57px);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; height: auto; }
    }

    .panel-form {
      overflow-y: auto;
      padding: 20px 24px 80px;
      border-right: 1px solid var(--border);
    }
    .panel-preview {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #0a0c14;
    }

    /* ---- form ------------------------------------------------ */
    .section {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
    }
    .section-head:hover { background: var(--card-soft); }
    .section-title {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; font-size: 13px;
    }
    .section-title .num {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--card-soft);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 11px; color: var(--muted);
    }
    .section.is-open .section-title .num {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .chev {
      color: var(--muted);
      transition: transform 0.15s ease;
      font-size: 12px;
    }
    .section.is-open .chev { transform: rotate(90deg); }
    .section-body { display: none; padding: 4px 14px 14px; }
    .section.is-open .section-body { display: block; }

    /* fields */
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }
    .field input[type="text"],
    .field input[type="url"],
    .field textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      transition: border-color 0.15s ease;
    }
    .field textarea {
      resize: vertical;
      min-height: 70px;
      line-height: 1.45;
    }
    .field input:focus, .field textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .field .hint {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* toggle on section head */
    .toggle {
      position: relative;
      width: 34px; height: 20px;
      border-radius: 999px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s ease;
      flex-shrink: 0;
    }
    .toggle::after {
      content: "";
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--muted);
      transition: all 0.15s ease;
    }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle.on::after { left: 16px; background: #fff; }

    /* repeatable blocks */
    .repeat-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      background: var(--bg);
    }
    .repeat-item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .add-btn {
      width: 100%;
      padding: 8px;
      font-size: 12px;
      border-style: dashed;
      color: var(--muted);
    }
    .add-btn:hover { color: var(--accent-light); border-color: var(--accent); }

    /* ---- preview / code tabs -------------------------------- */
    .tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .tab-group { display: flex; gap: 4px; background: var(--card); border-radius: 8px; padding: 3px; }
    .tab {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      border: none;
      background: transparent;
    }
    .tab.active { background: var(--accent); color: #fff; }
    .tab:not(.active):hover { color: var(--text); }

    .device-group {
      display: flex; gap: 4px;
      background: var(--card); border-radius: 8px; padding: 3px;
    }
    .device {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      background: transparent;
      border: none;
    }
    .device.active { background: var(--card-soft); color: var(--text); }

    .preview-wrap {
      flex: 1;
      overflow: auto;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .preview-frame {
      width: 100%;
      max-width: 600px;
      min-height: 600px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .preview-frame.mobile { max-width: 380px; }

    .code-wrap {
      flex: 1;
      overflow: auto;
      padding: 0;
      position: relative;
    }
    .code-wrap pre {
      margin: 0;
      padding: 20px 24px 60px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.55;
      color: #d9e0ee;
      white-space: pre;
      tab-size: 2;
    }
    .copy-bar {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 16px;
      background: linear-gradient(180deg, #0a0c14 70%, transparent);
      z-index: 1;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      box-shadow: 0 8px 30px rgba(153, 82, 224, 0.4);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* hide content tabs initially */
    .pane { display: none; height: calc(100% - 57px); }
    .pane.active { display: flex; flex-direction: column; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--card-soft); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>NinA AI <small>Email Editor</small></span>
    </div>
    <div class="topbar-actions">
      <button id="btn-sample" class="ghost">Load sample</button>
      <button id="btn-clear" class="ghost">Clear all</button>
      <button id="btn-download" class="ghost">Download .html</button>
      <button id="btn-copy" class="primary">Copy HTML</button>
    </div>
  </div>

  <div class="layout">
    <!-- ============================================== -->
    <!-- LEFT: form                                     -->
    <!-- ============================================== -->
    <aside class="panel-form" id="form-root"></aside>

    <!-- ============================================== -->
    <!-- RIGHT: preview / code                          -->
    <!-- ============================================== -->
    <section class="panel-preview">
      <div class="tabs">
        <div class="tab-group">
          <button class="tab active" data-tab="preview">Preview</button>
          <button class="tab" data-tab="code">Code</button>
        </div>
        <div class="device-group" id="device-group">
          <button class="device active" data-device="desktop">Desktop</button>
          <button class="device" data-device="mobile">Mobile</button>
        </div>
      </div>

      <div class="pane active" data-pane="preview">
        <div class="preview-wrap">
          <iframe class="preview-frame" id="preview-frame" title="Email preview"></iframe>
        </div>
      </div>

      <div class="pane" data-pane="code">
        <div class="code-wrap">
          <div class="copy-bar">
            <button id="btn-copy-2" class="primary">Copy</button>
          </div>
          <pre><code id="code-view"></code></pre>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast">Gekopieerd!</div>

      toggleKey: 'SHOW_SIGNATURE',
      fields: [
        { key: 'SIGNATURE_TEXT', label: 'Aanhef (bv. "Tot snel,")', type: 'text' },
        { key: 'SIGNATURE_PHOTO_URL', label: 'Foto URL (wordt rond)', type: 'url' },
        { key: 'SIGNATURE_PHOTO_ALT', label: 'Foto alt', type: 'text' },
        { key: 'SIGNATURE_SCRIPT_URL', label: 'Handgeschreven signature URL (optioneel)', type: 'url' },
        { key: 'SIGNATURE_NAME', label: 'Naam', type: 'text' },
        { key: 'SIGNATURE_ROLE', label: 'Rol', type: 'text' },
      ],
    },
    {
      id: 'footerlinks',
      title: 'Multi-column footer links',
      toggleKey: 'SHOW_FOOTER_LINKS',
      repeat: {
        key: 'FOOTER_LINK_GROUPS',
        itemLabel: 'Kolom',
        maxItems: 3,
        fields: [
          { key: 'TITLE', label: 'Kolomtitel', type: 'text' },
          { key: 'LINKS', label: 'Links', type: 'links' },
        ],
      },
    },
    {
      id: 'footer',
      title: 'Footer (brand block)',
      toggleKey: 'SHOW_FOOTER',
      fields: [
        { key: 'FOOTER_COMPANY', label: 'Bedrijfsnaam', type: 'text' },
        { key: 'FOOTER_TAGLINE', label: 'Tagline onder bedrijfsnaam', type: 'text' },
        { key: 'FOOTER_ADDRESS', label: 'Adres', type: 'text' },
        { key: 'LINKEDIN_URL', label: 'LinkedIn URL', type: 'url' },
        { key: 'TIKTOK_URL', label: 'TikTok URL', type: 'url' },
        { key: 'INSTAGRAM_URL', label: 'Instagram URL (optioneel)', type: 'url' },
        { key: 'X_URL', label: 'X / Twitter URL (optioneel)', type: 'url' },
        { key: 'UNSUBSCRIBE_URL', label: 'Unsubscribe URL', type: 'url' },
        { key: 'PREFERENCES_URL', label: 'Voorkeuren URL (optioneel)', type: 'url' },
        { key: 'VIEW_IN_BROWSER_URL', label: 'View-in-browser URL (optioneel)', type: 'url' },
        { key: 'COPYRIGHT_YEAR', label: 'Copyright jaar', type: 'text' },
      ],
    },
  ];

  /* ===========================================================
     STATE — single source of truth, persisted to localStorage.
     =========================================================== */
  const STORAGE_KEY = 'nina-email-editor-v2';
  const SAMPLE = window.NINA_SAMPLE_DATA || {};
  const TEMPLATE_HTML = window.NINA_EMAIL_TEMPLATE || '';
  // Same helpers as build.js so {{add @index 1}} works in numbered content.
  Handlebars.registerHelper('add', (a, b) => Number(a) + Number(b));
  const compiledTemplate = Handlebars.compile(TEMPLATE_HTML);

  let state = loadState() || structuredClone(SAMPLE);

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }

  /* ===========================================================
     RENDER FORM
     =========================================================== */
  const formRoot = document.getElementById('form-root');

  function renderForm() {
    formRoot.innerHTML = '';
    SCHEMA.forEach((sec, idx) => {
      const isToggled = sec.toggleKey ? !!state[sec.toggleKey] : true;
      const showSection = sec.toggleKey ? isToggled : true;

      const $sec = el('div', { class: 'section ' + (showSection ? 'is-open' : '') });

      const $head = el('div', { class: 'section-head' });
      const $title = el('div', { class: 'section-title' });
      $title.appendChild(el('span', { class: 'num' }, String(idx + 1)));
      $title.appendChild(el('span', {}, sec.title));
      $head.appendChild($title);

      const $right = el('div', { style: 'display:flex;align-items:center;gap:10px;' });
      if (sec.toggleKey) {
        const $tog = el('div', {
          class: 'toggle ' + (isToggled ? 'on' : ''),
          title: 'In/uit',
        });
        $tog.addEventListener('click', (e) => {
          e.stopPropagation();
          state[sec.toggleKey] = !state[sec.toggleKey];
          saveState();
          renderForm();
          renderPreview();
        });
        $right.appendChild($tog);
      }
      $right.appendChild(el('span', { class: 'chev' }, '›'));
      $head.appendChild($right);

      $head.addEventListener('click', () => $sec.classList.toggle('is-open'));
      $sec.appendChild($head);

      const $body = el('div', { class: 'section-body' });

      // Section-level fields (these write to state[f.key])
      if (sec.fields && sec.fields.length) {
        sec.fields.forEach((f) => $body.appendChild(renderField(f, state)));
      } else if (!sec.repeat) {
        $body.appendChild(el('div', { class: 'hint' },
          'Geen velden — toggle bepaalt of dit blok in de email staat.'));
      }

      // Repeating items (arrays)
      if (sec.repeat) {
        const arrKey = sec.repeat.key;
        if (!Array.isArray(state[arrKey])) state[arrKey] = [];

        if (sec.fields && sec.fields.length) {
          $body.appendChild(el('div', {
            class: 'hint',
            style: 'margin: 10px 0 6px; color:#a6a6a6; font-size:11px; letter-spacing:0.5px; text-transform:uppercase;',
          }, sec.repeat.itemLabel + ' items'));
        }

        state[arrKey].forEach((_, i) => {
          $body.appendChild(renderRepeatItem(sec.repeat, arrKey, i));
        });

        const max = sec.repeat.maxItems;
        if (!max || state[arrKey].length < max) {
          const $add = el('button', { class: 'add-btn ghost', type: 'button' },
            '+ ' + sec.repeat.itemLabel + ' toevoegen');
          $add.addEventListener('click', () => {
            const item = emptyItem(sec.repeat.fields);
            state[arrKey].push(item);
            saveState();
            renderForm();
            renderPreview();
          });
          $body.appendChild($add);
        }
      }

      $sec.appendChild($body);
      formRoot.appendChild($sec);
    });
  }

  function emptyItem(fields) {
    const item = {};
    fields.forEach(f => {
      if (f.type === 'links') item[f.key] = [];
      else if (f.type === 'bool') item[f.key] = false;
      else item[f.key] = '';
    });
    return item;
  }

  /* Renders a single field bound to target[f.key]. */
  function renderField(f, target) {
    const $field = el('div', { class: 'field' });
    $field.appendChild(el('label', {}, f.label));

    if (f.type === 'bool') {
      const checked = !!target[f.key];
      const $tog = el('div', { class: 'toggle ' + (checked ? 'on' : '') });
      $tog.addEventListener('click', () => {
        target[f.key] = !target[f.key];
        saveState();
        renderForm();
        renderPreview();
      });
      $field.appendChild($tog);
    } else if (f.type === 'links') {
      // Nested array of {TEXT, URL} — mini repeat inside the parent.
      if (!Array.isArray(target[f.key])) target[f.key] = [];
      target[f.key].forEach((_, j) => {
        const $row = el('div', { class: 'repeat-item', style: 'margin-bottom:6px;' });
        const $head = el('div', { class: 'repeat-item-head' });
        $head.appendChild(el('span', {}, 'Link ' + (j + 1)));
        const $rm = el('button', { class: 'danger ghost', type: 'button' }, '×');
        $rm.addEventListener('click', () => {
          target[f.key].splice(j, 1);
          saveState();
          renderForm();
          renderPreview();
        });
        $head.appendChild($rm);
        $row.appendChild($head);
        $row.appendChild(renderField({ key: 'TEXT', label: 'Tekst', type: 'text' }, target[f.key][j]));
        $row.appendChild(renderField({ key: 'URL', label: 'URL', type: 'url' }, target[f.key][j]));
        $field.appendChild($row);
      });
      const $add = el('button', { class: 'add-btn ghost', type: 'button' }, '+ Link toevoegen');
      $add.addEventListener('click', () => {
        target[f.key].push({ TEXT: '', URL: '' });
        saveState();
        renderForm();
        renderPreview();
      });
      $field.appendChild($add);
    } else {
      const value = target[f.key] != null ? String(target[f.key]) : '';
      let $input;
      if (f.type === 'textarea') {
        $input = el('textarea', { rows: 3 });
        $input.value = value;
      } else {
        $input = el('input', { type: f.type === 'url' ? 'url' : 'text' });
        $input.value = value;
      }
      $input.addEventListener('input', () => {
        target[f.key] = $input.value;
        saveState();
        renderPreview();
      });
      $field.appendChild($input);
    }

    if (f.hint) $field.appendChild(el('div', { class: 'hint' }, f.hint));
    return $field;
  }

  function renderRepeatItem(repeatDef, arrKey, idx) {
    const $wrap = el('div', { class: 'repeat-item' });
    const $head = el('div', { class: 'repeat-item-head' });
    $head.appendChild(el('span', {}, repeatDef.itemLabel + ' ' + (idx + 1)));
    const $rm = el('button', { class: 'danger ghost', type: 'button' }, 'Verwijder');
    $rm.addEventListener('click', () => {
      state[arrKey].splice(idx, 1);
      saveState();
      renderForm();
      renderPreview();
    });
    $head.appendChild($rm);
    $wrap.appendChild($head);

    repeatDef.fields.forEach((f) => {
      $wrap.appendChild(renderField(f, state[arrKey][idx]));
    });
    return $wrap;
  }

  /* ===========================================================
     RENDER PREVIEW + CODE
     =========================================================== */
  const previewFrame = document.getElementById('preview-frame');
  const codeView = document.getElementById('code-view');

  let renderedHtml = '';
  function renderPreview() {
    try {
      renderedHtml = compiledTemplate(state);
    } catch (err) {
      renderedHtml = '<pre>Render error: ' + (err && err.message) + '</pre>';
    }
    previewFrame.srcdoc = renderedHtml;
    codeView.textContent = renderedHtml;
  }

  /* ===========================================================
     TABS + DEVICE TOGGLE
     =========================================================== */
  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      const target = t.dataset.tab;
      document.querySelectorAll('.pane').forEach(p => {
        p.classList.toggle('active', p.dataset.pane === target);
      });
    });
  });
  document.querySelectorAll('.device').forEach((d) => {
    d.addEventListener('click', () => {
      document.querySelectorAll('.device').forEach(x => x.classList.remove('active'));
      d.classList.add('active');
      previewFrame.classList.toggle('mobile', d.dataset.device === 'mobile');
    });
  });

  /* ===========================================================
     TOP BAR ACTIONS
     =========================================================== */
  document.getElementById('btn-sample').addEventListener('click', () => {
    state = structuredClone(SAMPLE);
    saveState();
    renderForm();
    renderPreview();
    toast('Sample data geladen');
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    if (!confirm('Alle velden wissen?')) return;
    state = {};
    SCHEMA.forEach(s => {
      if (s.toggleKey) state[s.toggleKey] = false;
      (s.fields || []).forEach(f => {
        if (f.type === 'bool') state[f.key] = false;
        else if (f.type === 'links') state[f.key] = [];
        else state[f.key] = '';
      });
      if (s.repeat) state[s.repeat.key] = [];
    });
    saveState();
    renderForm();
    renderPreview();
    toast('Velden gewist');
  });

  document.getElementById('btn-copy').addEventListener('click', copyHtml);
  document.getElementById('btn-copy-2').addEventListener('click', copyHtml);

  document.getElementById('btn-download').addEventListener('click', () => {
    const blob = new Blob([renderedHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nina-email.html';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  async function copyHtml() {
    try {
      await navigator.clipboard.writeText(renderedHtml);
      toast('HTML gekopieerd!');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = renderedHtml;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('HTML gekopieerd!'); }
      catch { toast('Kopiëren mislukt — selecteer handmatig in Code tab'); }
      ta.remove();
    }
  }

  /* ===========================================================
     UTIL
     =========================================================== */
  function el(tag, attrs = {}, text) {
    const n = document.createElement(tag);
    for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    if (text != null) n.textContent = text;
    return n;
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  /* boot */
  if (!TEMPLATE_HTML) {
    formRoot.innerHTML =
      '<div style="padding:20px;color:#e0526a;">' +
      'Template niet geladen. Run eerst <code>node build.js --data sample-data.json</code>' +
      ' zodat <code>dist/template.js</code> bestaat.</div>';
  } else {
    renderForm();
    renderPreview();
  }
  </script>
</body>
</html>
